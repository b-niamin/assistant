# Dependency and base image updates as pull requests (audit report T4), majors included.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native compiler) has no compiler API yet; svelte-check and SvelteKit need 5 or 6.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/docker/terminal, /docker/browser, /docker/worker, /docker/migrate]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
