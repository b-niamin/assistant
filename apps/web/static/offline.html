<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Assistant</title>
    <style>
      :root { color-scheme: light dark; --page: #f9f9f7; --ink: #0b0b0b; --ink-2: #52514e; }
      @media (prefers-color-scheme: dark) { :root { --page: #0d0d0d; --ink: #f0efec; --ink-2: #c3c2b7; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 16px; text-align: center; }
      p { color: var(--ink-2); max-width: 34ch; margin: 0 auto 12px; }
      button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid #8a8984; background: none; color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" width="72" height="72" alt="" />
      <h1>Can't reach the assistant</h1>
      <p>It lives on your home network: turn on Tailscale on this device (or join the home Wi-Fi), then try again.</p>
      <p lang="pl">Asystent działa w sieci domowej: włącz Tailscale na tym urządzeniu (albo połącz się z domowym Wi-Fi) i spróbuj ponownie.</p>
      <button onclick="location.reload()">Try again · Spróbuj ponownie</button>
    </main>
  </body>
</html>
