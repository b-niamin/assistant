# assistant: production stack. Run from the repo root on the 24/7 machine:
#   ./install.sh           # writes .env with random secrets, starts, prints the /setup code
#   (or by hand: cp .env.example .env, fill in secrets, docker compose up -d)
# Extensions' background work runs in `worker` (no host step). An extension that still brings its own
# extensions/<id>/compose.yml is listed by install.sh in COMPOSE_FILE in .env.
#
# Only `web` publishes ports, on 127.0.0.1: the app for Tailscale Serve (tailnet only), and the MCP listener
# for Tailscale Funnel (internet, only when the Claude connector is on). Everything else is internal.
# Code is bind-mounted, so a commit in this checkout is live on the next tick / rebuild.
# Keep the compose project name stable: volumes are prefixed with it.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
    # Postgres keeps its data in /var/lib/postgresql/<major>/docker. A volume with another major's data and
    # none of this one's does not start: a new major would otherwise begin with an empty database next to
    # the old one. Restore the latest daily backup into a new volume (docs/install.md, Upgrading Postgres).
    entrypoint:
      - sh
      - -c
      - |
        other=$$(cd /var/lib/postgresql && ls -d */docker/PG_VERSION 2>/dev/null | cut -d/ -f1 | grep -vx "$$PG_MAJOR" | head -n 1)
        if [ -n "$$other" ] && [ ! -f "/var/lib/postgresql/$$PG_MAJOR/docker/PG_VERSION" ]; then
          echo "This volume holds a Postgres $$other database; this image is Postgres $$PG_MAJOR. Restore the latest backup into a new volume: docs/install.md, Upgrading Postgres." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-assistant} -d ${POSTGRES_DB:-assistant}']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  # One-shot: applies db/migrations/*.sql and the least-privilege roles, then exits. The scripts and core
  # migrations are baked into the image from main (docker/migrate/Dockerfile), never read from the checkout.
  migrate:
    build: { context: ., dockerfile: docker/migrate/Dockerfile }
    restart: 'no'
    depends_on:
      db: { condition: service_healthy }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      # Login of extension background services (role ext_<id>_svc). Optional.
      SERVICES_DB_PASSWORD: ${SERVICES_DB_PASSWORD:-}
      CLAUDE_DB_PASSWORD: ${CLAUDE_DB_PASSWORD:?set CLAUDE_DB_PASSWORD in .env}
      # Owner of the files web writes in the logs volume (web.log).
      HOST_UID: ${HOST_UID:-1000}
    volumes:
      # Installed extensions: their db/migrations and per-extension roles (spec 002).
      - ./extensions:/extensions:ro
      - logs:/logs
      # Handed to HOST_UID here, for web (see the web service).
      - updater-control:/updater
    # The postgres image declares a data VOLUME this client never uses: a tmpfs there, so no anonymous
    # volume is made (one left behind each time a container is recreated or a start is interrupted).
    tmpfs: [/var/lib/postgresql]
    entrypoint: ['sh', '/migrate.sh']

  # Re-applies migrations when Claude installs or updates an extension, so that needs no human step.
  # Same image as migrate: core migrations only from main, extension ones from extensions/.
  ext-migrate:
    build: { context: ., dockerfile: docker/migrate/Dockerfile }
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SERVICES_DB_PASSWORD: ${SERVICES_DB_PASSWORD:-}
      CLAUDE_DB_PASSWORD: ${CLAUDE_DB_PASSWORD}
    volumes:
      - ./extensions:/extensions:ro
      - logs:/logs
    tmpfs: [/var/lib/postgresql] # no anonymous volume (see migrate)
    entrypoint: ['sh', '-c', 'sh /watch-extensions.sh 2>&1 | tee -a /logs/ext-migrate.log']

  # Background work of the extensions (spec 002, "Background work"): their services and scheduled jobs,
  # under one supervisor that picks up a newly installed extension within seconds (no host step). Each
  # extension runs as its own uid with its own database login (ext_<id>_svc). The only container that
  # sees the host: /proc and /sys, read-only (docker/worker/access.json lists them; spec 004). No port, no
  # docker socket, no .env, not the `logs` volume (the updater's control file is there).
  worker:
    build:
      context: ./docker/worker
    restart: unless-stopped
    init: true
    depends_on:
      migrate: { condition: service_completed_successfully }
    # The machine's host name instead of the container's id (e.g. for the monitor extension).
    uts: host
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      # Each extension's login password is derived from it (docker/worker/worker.py, db/migrate.sh).
      SERVICES_DB_PASSWORD: ${SERVICES_DB_PASSWORD:-}
      # Handed only to the units whose manifest asks for them ("keys").
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      DEFAULT_PROFILE: ${DEFAULT_PROFILE:-}
      TZ: ${APP_TIMEZONE:-UTC}
      # Owner of /worker/control, where the web app leaves its requests (restart, run now).
      HOST_UID: ${HOST_UID:-1000}
    volumes:
      - ./extensions:/extensions:ro
      - worker:/worker
      - worker-data:/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g

  # Web UI + API. Live-reload builds into build-next/ and swaps it in only after a successful build.
  # Bound to 127.0.0.1: reach it through Tailscale (`tailscale serve --bg 3000` on the host), not the LAN.
  web:
    # Same base (glibc) as the terminal image and the same uid as the checkout owner, so both containers
    # can share apps/web/node_modules and .svelte-kit/ without permission clashes.
    image: node:26-trixie-slim
    user: '${HOST_UID:-1000}'
    restart: unless-stopped
    working_dir: /app
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: ['sh', '-c', 'node scripts/live-reload.mjs 2>&1 | tee -a /logs/web.log']
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
      # The public listener: only the MCP server and its OAuth (spec 005). Tailscale Funnel publishes it
      # when System settings -> Claude connector is on; the host's updater runs `tailscale funnel` for that.
      - '127.0.0.1:${MCP_PORT:-3101}:3001'
    environment:
      NODE_ENV: production
      MCP_PORT: '3001'
      NODE_OPTIONS: --max-old-space-size=1024
      PORT: '3000'
      # The public origin: baked into the build for CSRF and url.origin (vite.config.ts paths.origin, read
      # when live-reload builds here) and checked on sidecar WebSocket upgrades (server.mjs).
      ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      DATABASE_URL: postgresql://app_rw:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-assistant}
      # Optional: without it the first-run wizard (/setup, needs SETUP_TOKEN) stores the password hash.
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Profile used when none is picked; empty = the first one (made in /setup).
      DEFAULT_PROFILE: ${DEFAULT_PROFILE:-}
      TZ: ${APP_TIMEZONE:-UTC}
      HOME: /tmp
      # Encrypts extension secrets (System settings). Optional: without it secrets cannot be stored.
      SECRETS_KEY: ${SECRETS_KEY:-}
      # Signs the single-use tickets for the terminal and browser sidecars (spec 004). Empty = both off.
      SIDECAR_TICKET_SECRET: ${SIDECAR_TICKET_SECRET:-}
      UPDATER_CONTROL_FILE: /updater/control
      # Lets the AI CLIs in the terminal call the extensions' tools at /mcp (spec 005). Empty = off.
      CLAUDE_TOOLS_TOKEN: ${CLAUDE_TOOLS_TOKEN:-}
      # More hosts that may receive the connector's OAuth codes, besides claude.ai and claude.com (spec 005).
      MCP_REDIRECT_HOSTS: ${MCP_REDIRECT_HOSTS:-}
      # What "Extend the system" offers; empty = the catalog.json of github.com/b-niamin/assistant-extensions.
      EXTENSIONS_CATALOG_URL: ${EXTENSIONS_CATALOG_URL:-}
    volumes:
      - ./apps/web:/app
      # Installed extensions, compiled into the shell (spec 002). Read-only: only Claude edits them.
      - ./extensions:/extensions:ro
      - logs:/logs
      # The worker's status and logs (System settings -> Worker); requests go to /worker/control.
      - worker:/worker
      # The app's requests to the updater (mode, Update now, Funnel): no other container sees them.
      - updater-control:/updater
    # sidecars: the internal network of the terminal and browser containers (spec 004).
    networks: [default, sidecars]
    mem_limit: 1536m

  # In-app terminal (spec 004): the dock at the bottom of every page, with Claude Code, Codex and gh. Logins
  # typed there (`claude` + /login, `codex login`, `gh auth login`) live in the agent-home volume. No port, no
  # docker socket, no .env; the web app proxies to it only with a single-use ticket, which it re-checks.
  # See docker/terminal/README.md.
  terminal:
    build:
      context: ./docker/terminal
      # Must match the owner of this checkout on the host (Synology: `id -u`, often 1026).
      args:
        UID: ${HOST_UID:-1000}
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    working_dir: /workspace
    environment:
      SIDECAR_TICKET_SECRET: ${SIDECAR_TICKET_SECRET:-}
      CLAUDE_RO_DATABASE_URL: postgresql://claude_ro:${CLAUDE_DB_PASSWORD}@db:5432/${POSTGRES_DB:-assistant}
      # The agents' read-write role (db/roles.sql): data of core and every extension, no DDL, no secrets.
      AGENT_DATABASE_URL: postgresql://agent_rw:${CLAUDE_DB_PASSWORD}@db:5432/${POSTGRES_DB:-assistant}
      # Tools for the agents (spec 005): the `assistant` MCP server in .mcp.json calls the web app's /mcp with this.
      CLAUDE_TOOLS_TOKEN: ${CLAUDE_TOOLS_TOKEN:-}
      ASSISTANT_URL: http://web:3000
      DEFAULT_PROFILE: ${DEFAULT_PROFILE:-}
      # Where `ext install` takes ready-made extensions from; empty = github.com/b-niamin/assistant-extensions.
      EXTENSIONS_REPO: ${EXTENSIONS_REPO:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Claude}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-noreply@anthropic.com}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-Claude}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-noreply@anthropic.com}
      # Optional: fine-grained PAT with Contents read/write on this ONE repo, so commits get pushed.
      GITHUB_TOKEN: ${CLAUDE_GITHUB_TOKEN:-}
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - .:/workspace
      # Shadow the secrets file: the container sees an empty .env.
      - /dev/null:/workspace/.env:ro
      - agent-home:/home/claude
      - logs:/logs:ro
      # The worker's status and its units' logs, to read (spec 002, "Background work").
      - worker:/worker:ro
    # sidecars: the web app reaches it there, and it drives the in-app browser over CDP (browser:9223).
    networks: [default, sidecars]
    mem_limit: 2g

  # In-app browser (spec 004): System settings -> Browser. Chromium + noVNC; its signed-in profile is
  # in the browser-profile volume (treat it as a secret). Only reachable on the internal sidecars network.
  browser:
    build: ./docker/browser
    restart: unless-stopped
    environment:
      BROWSER_SCREEN: ${BROWSER_SCREEN:-1366x860}
      # noVNC accepts only the web proxy, which sends this Origin; pages in the browser cannot (spec 004).
      VNC_EXPECT_ORIGIN: ${PUBLIC_ORIGIN:-}
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - browser-profile:/data
    shm_size: 512m
    networks: [sidecars, browser-egress]
    mem_limit: 1536m

  # Daily backup (db/backup.sh, docs/install.md "Backups"): database dump + .env + installed extensions in
  # one folder per day under BACKUP_DIR, a host folder OUTSIDE the checkout (the terminal sees the
  # checkout; a backup holds .env). Default: next to the checkout, e.g. /volume1/docker/assistant-backups,
  # where the host's own backup (Synology Hyper Backup, Time Machine) can pick it up.
  # Restore: sudo ./beni.sh restore <BACKUP_DIR>/beni-<day>. Status: /logs/backup-status.json.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-assistant}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-assistant}
      TZ: ${APP_TIMEZONE:-UTC}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
    volumes:
      - ${BACKUP_DIR:-../assistant-backups}:/backups
      - ./db/backup.sh:/backup.sh:ro
      - ./.env:/instance/.env:ro
      - ./extensions:/instance/extensions:ro
      - logs:/logs
    tmpfs: [/var/lib/postgresql] # no anonymous volume (see migrate)
    entrypoint: ['sh', '/backup.sh']

networks:
  default:
  # Internal: web, terminal and browser only. No internet, nothing else can reach noVNC/CDP.
  sidecars:
    internal: true
  # The browser's own way out to the internet, shared with no other service.
  browser-egress:

volumes:
  # The app's requests to the host's updater (spec 006): only web mounts it, the updater reads it.
  updater-control:
  browser-profile:
  db-data:
  # The agents' home (logins of Claude, Codex, gh).
  agent-home:
  logs:
  # The worker's status, logs and the app's requests to it; its units' data and venvs.
  worker:
  worker-data:
