# tmux for the in-app terminal (System settings -> Terminal). Looks only: a quiet status line in the
# app's colours (specs/001-design.md) instead of tmux's green bar. Read when the tmux server starts.
# 256-colour indexes, not hex: tmux maps hex to the nearest of these anyway when TERM lacks truecolor.
set -sg escape-time 10
set -g history-limit 10000
set -g status-style 'bg=colour234,fg=colour245'
set -g status-left-length 30
set -g status-left '#[bg=colour208,fg=colour233,bold] #S #[bg=colour234,fg=colour245,nobold] '
set -g status-right '#[fg=colour242]%H:%M '
set -g window-status-format '#[fg=colour245] #I #W '
set -g window-status-current-format '#[bg=colour236,fg=colour255,bold] #I #W '
set -g window-status-separator ''
set -g message-style 'bg=colour236,fg=colour255'
set -g mode-style 'bg=colour32,fg=colour255'
set -g pane-border-style 'fg=colour236'
set -g pane-active-border-style 'fg=colour208'
